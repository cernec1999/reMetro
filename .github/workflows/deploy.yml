name: Deploy remetro-fetch to ECS

on:
  push:
    branches: ["main"]
    paths:
      - "remetro-fetch/**"
      - "remetro-protobuf/**"
      - "remetro-cloud/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-remetro-fetch-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: remetro-fetch
        run: mvn --no-transfer-progress test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPO: remetro-fetch
      TF_DIR: remetro-cloud

    steps:
      - uses: actions/checkout@v4

      # ---- AWS auth via OIDC (no long-lived keys stored in GitHub) ----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---- Build & push Docker image (root context; Dockerfile in remetro-fetch/) ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: remetro-fetch/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Terraform apply ----
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply \
            -var-file=prod.tfvars \
            -var="image_tag=${{ github.sha }}" \
            -auto-approve
