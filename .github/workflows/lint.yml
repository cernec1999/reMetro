name: Python Linting

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'remetro-font/**/*.py'
      - 'remetro-font/pyproject.toml'
      - 'remetro-font/.flake8'
      - 'remetro-font/bin/lint*.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'remetro-font/**/*.py'
      - 'remetro-font/pyproject.toml'
      - 'remetro-font/.flake8'
      - 'remetro-font/bin/lint*.sh'
      - '.github/workflows/lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('remetro-font/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pyqt5

    - name: Install Python dependencies
      working-directory: remetro-font
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run comprehensive linting check
      working-directory: remetro-font
      run: |
        chmod +x bin/lint-check.sh
        bin/lint-check.sh

  # Optional job to show what automatic fixes would be applied
  lint-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pyqt5

    - name: Install Python dependencies
      working-directory: remetro-font
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Show what automatic fixes would be applied
      working-directory: remetro-font
      run: |
        echo "🔍 Checking what automatic fixes would be applied..."
        echo "📝 Black formatting changes:"
        black --check --diff src/ || echo "✅ No black formatting changes needed"
        echo ""
        echo "📚 isort import changes:"
        isort --check-only --diff src/ || echo "✅ No import sorting changes needed"
        echo ""
        echo "ℹ️  To apply these fixes locally, run: bin/lint.sh"