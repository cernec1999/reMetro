[package]
edition      = "2024"
name         = "metro-esp32"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "metro-esp32"
path = "./src/main.rs"
test = false
bench = false

[dependencies]
# Core ESP32 dependencies
esp-hal = { version = "=1.0.0-rc.1", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.1.1", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3"] }
esp-bootloader-esp-idf = { version = "0.3.0", features = ["esp32s3"] }
esp-alloc = "0.9.0"
esp-println = { version = "0.16.0", features = ["esp32s3"] }

# Embassy async runtime
embassy-executor = { version = "0.9.0", features = [] }
embassy-time = "0.5.0"

# Networking (WiFi and BLE)
embassy-net = { version = "0.7.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp"] }
esp-radio = { version = "0.16.0", features = ["ble", "coex", "esp-alloc", "esp32s3", "smoltcp", "unstable", "wifi"] }
smoltcp = { version = "0.12.0", default-features = false, features = ["medium-ethernet", "multicast", "proto-dhcpv4", "proto-dns", "proto-ipv4", "socket-dns", "socket-icmp", "socket-raw", "socket-tcp", "socket-udp"] }
bt-hci = "0.6.0"
trouble-host = { version = "0.5.0", features = ["gatt"] }

# IO and utilities
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
critical-section = "1.2.0"
static_cell = "2.1.1"

# Display and graphics
esp-hub75 = { version = "0.7.0", features = ["esp32s3"] }
embedded-graphics = "0.8.1"
metro-render = { path = "../metro-render" }
u8g2-fonts = "0.7.2"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
