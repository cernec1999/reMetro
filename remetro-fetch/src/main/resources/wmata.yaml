openapi: 3.0.1
info:
  title: WMATA Rail API
  description: Predictions and station information for WMATA Metro.
  version: '1.0'
servers:
  - url: https://api.wmata.com
paths:
  '/StationPrediction.svc/json/GetPrediction/{StationCodes}':
    get:
      summary: Next Train Predictions
      operationId: getPredictionJson
      security:
        - apiKeyHeader: []
        - apiKeyQuery: []
      parameters:
        - name: StationCodes
          in: path
          required: true
          schema:
            type: string
            default: All
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainPredictionResponse'

  '/Rail.svc/json/jStations':
    get:
      summary: Station Information
      operationId: getStationsJson
      security:
        - apiKeyHeader: []
        - apiKeyQuery: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationInfoResponse'

components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: api_key
      in: header
    apiKeyQuery:
      type: apiKey
      name: api_key
      in: query

  schemas:
    # ── Predictions ───────────────────────────────────────────────────────────
    TrainPredictionResponse:
      type: object
      properties:
        Trains:
          type: array
          items:
            $ref: '#/components/schemas/TrainPrediction'

    TrainPrediction:
      type: object
      properties:
        Car:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"Car\")"
        Destination:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"Destination\")"
        DestinationCode:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"DestinationCode\")"
        DestinationName:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"DestinationName\")"
        Group:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"Group\")"
        Line:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"Line\")"
        LocationCode:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"LocationCode\")"
        LocationName:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"LocationName\")"
        Min:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"Min\")"

    # ── Stations ──────────────────────────────────────────────────────────────
    StationInfoResponse:
      type: object
      properties:
        Stations:
          type: array
          items:
            $ref: '#/components/schemas/StationInfo'

    StationInfo:
      type: object
      properties:
        Code:
          type: string
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"Code\")"
        Name:
          type: string
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"Name\")"
        StationTogether1:
          type: string
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"StationTogether1\")"
        StationTogether2:
          type: string
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"StationTogether2\")"
        LineCode1:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"LineCode1\")"
        LineCode2:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"LineCode2\")"
        LineCode3:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"LineCode3\")"
        LineCode4:
          type: string
          nullable: true
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"LineCode4\")"
        Lat:
          type: number
          format: double
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"Lat\")"
        Lon:
          type: number
          format: double
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"Lon\")"
        Address:
          $ref: '#/components/schemas/StationAddress'

    StationAddress:
      type: object
      properties:
        Street:
          type: string
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"Street\")"
        City:
          type: string
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"City\")"
        State:
          type: string
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"State\")"
        Zip:
          type: string
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"Zip\")"

security:
  - apiKeyHeader: []
  - apiKeyQuery: []
